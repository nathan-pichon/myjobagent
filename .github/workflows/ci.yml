name: CI

# Runs the offline test suite for the jobhunt engine (no LLM, no network).

on:
  push:
    branches: [main]
    paths: ["jobhunt/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["jobhunt/**", "tests/**", "pyproject.toml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core only, no scrape extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
